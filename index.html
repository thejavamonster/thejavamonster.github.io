    <script>
        (function () {
            const ageCell = document.getElementById('age-cell');
            if (!ageCell) return;

            const birth = new Date(2009, 2, 28, 3, 0, 0);
            const now = new Date();

            const msPerYear = 365.2425 * 24 * 60 * 60 * 1000;
            const years = (now - birth) / msPerYear;

            const SVEDBERGS_PER_YEAR = 3.1556952e21; // as provided
            const svedbergs = years * SVEDBERGS_PER_YEAR;

            const absVal = Math.abs(svedbergs);
            const exponent = absVal === 0 ? 0 : Math.floor(Math.log10(absVal));
            const mantissa = absVal === 0 ? 0 : svedbergs / Math.pow(10, exponent);

            let mantissaStr = mantissa.toFixed(8);
            mantissaStr = mantissaStr.replace(/\.?(0+)$/, (m) => m.length > 1 ? '' : m);

            ageCell.textContent = `${mantissaStr} × 10^${exponent} svedbergs`;
        })();
    </script>
