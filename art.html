<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Miller</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E🎨%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="ticker.css">
        <style>
            /* Simple responsive grid */
            .gallery {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 12px;
                padding: 16px;
            }
            .card {
                position: relative;
                overflow: hidden;
                border-radius: 8px;
                background: #111;
                border: 1px solid #222;
                aspect-ratio: 1 / 1;
                display: grid;
                place-items: center;
            }
            .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
            .card figcaption {
                position: absolute;
                bottom: 0; left: 0; right: 0;
                padding: 6px 8px;
                background: linear-gradient(transparent, rgba(0,0,0,0.65));
                color: #eee; font-size: 12px;
                text-overflow: ellipsis; white-space: nowrap; overflow: hidden;
            }
            .empty { padding: 24px; text-align: center; color: #999; }
            
            /* Lightbox overlay */
            .lightbox {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.92);
                z-index: 9999;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .lightbox.active { display: flex; }
            .lightbox-content {
                position: relative;
                max-width: 90vw;
                max-height: 90vh;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .lightbox img {
                max-width: 100%;
                max-height: 80vh;
                object-fit: contain;
                border-radius: 4px;
            }
            .lightbox-caption {
                margin-top: 12px;
                color: #fff;
                font-size: 18px;
                text-align: center;
            }
            .lightbox-close {
                position: absolute;
                top: 10px; right: 10px;
                background: rgba(255,255,255,0.2);
                border: none;
                color: #fff;
                font-size: 32px;
                width: 48px; height: 48px;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background 0.2s;
            }
            .lightbox-close:hover { background: rgba(255,255,255,0.3); }
            .lightbox-nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(255,255,255,0.2);
                border: none;
                color: #fff;
                font-size: 36px;
                width: 56px; height: 56px;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background 0.2s;
            }
            .lightbox-nav:hover { background: rgba(255,255,255,0.3); }
            .lightbox-nav.prev { left: 20px; }
            .lightbox-nav.next { right: 20px; }
            </style>
        </head>
        <body>  
        <header>
            <h1>Planet Miller</h1>
            <nav>
                <ul>
                    <li><a href="index.html">home</a></li>
                    <li><a href="webapps.html">web apps</a></li>
                    <li><a href="videos.html">videos</a></li>
                    <li><a href="art.html">art</a></li>
                    <li><a href="contact.html">contact</a></li>
                </ul>
            </nav>
        </header>
        <div class="ticker-wrap">
            <div id="news-ticker" class="ticker">Loading headlines…</div>
        </div>
            <h2>Art</h2>
            <main>
                <section id="gallery" class="gallery" aria-live="polite"></section>
            </main>
            
            <!-- Lightbox overlay -->
            <div id="lightbox" class="lightbox">
                <button class="lightbox-close" aria-label="Close">&times;</button>
                <button class="lightbox-nav prev" aria-label="Previous">‹</button>
                <button class="lightbox-nav next" aria-label="Next">›</button>
                <div class="lightbox-content">
                    <img id="lightbox-img" src="" alt="">
                    <div id="lightbox-caption" class="lightbox-caption"></div>
                </div>
            </div>
                <script>
                        // Manual list of image filenames in the 'art' folder. Update this array when you add/remove files.
                        const FILES = [
                            'africa.png','asia.png','bat.png','brayden.png','chickadee.png','europe.png','fish.png','idek.png','javanmagpie.png','legolas.png','northamerica.png','skelly.png','southamerica.png','squirrel.png','stewart.png','weasel.png'
                        ];
                        const BASE = 'art/';
                        const gallery = document.getElementById('gallery');
                        function pretty(name) {
                            const base = name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
                            return base.replace(/(^|\s)\S/g, t => t.toUpperCase());
                        }
                        // Lightbox state
                        let currentIndex = 0;
                        const lightbox = document.getElementById('lightbox');
                        const lightboxImg = document.getElementById('lightbox-img');
                        const lightboxCaption = document.getElementById('lightbox-caption');
                        
                        function openLightbox(index) {
                            currentIndex = index;
                            const file = FILES[currentIndex];
                            const src = BASE + file;
                            const title = pretty(file);
                            lightboxImg.src = src;
                            lightboxImg.alt = title;
                            lightboxCaption.textContent = title;
                            lightbox.classList.add('active');
                            document.body.style.overflow = 'hidden';
                        }
                        
                        function closeLightbox() {
                            lightbox.classList.remove('active');
                            document.body.style.overflow = '';
                        }
                        
                        function navigate(direction) {
                            currentIndex = (currentIndex + direction + FILES.length) % FILES.length;
                            openLightbox(currentIndex);
                        }
                        
                        // Lightbox controls
                        document.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
                        document.querySelector('.lightbox-nav.prev').addEventListener('click', () => navigate(-1));
                        document.querySelector('.lightbox-nav.next').addEventListener('click', () => navigate(1));
                        lightbox.addEventListener('click', (e) => {
                            if (e.target === lightbox) closeLightbox();
                        });
                        
                        // Keyboard navigation
                        document.addEventListener('keydown', (e) => {
                            if (!lightbox.classList.contains('active')) return;
                            if (e.key === 'Escape') closeLightbox();
                            if (e.key === 'ArrowLeft') navigate(-1);
                            if (e.key === 'ArrowRight') navigate(1);
                        });
                        
                        (function render() {
                            const frag = document.createDocumentFragment();
                            FILES.forEach((file, index) => {
                                const src = BASE + file;
                                const title = pretty(file);
                                const fig = document.createElement('figure');
                                fig.className = 'card';
                                fig.setAttribute('role', 'group');
                                fig.tabIndex = 0;
                                fig.style.cursor = 'pointer';
                                
                                const img = document.createElement('img'); 
                                img.loading = 'lazy'; 
                                img.decoding = 'async'; 
                                img.src = src; 
                                img.alt = title;
                                
                                const cap = document.createElement('figcaption'); 
                                cap.textContent = title;
                                
                                fig.appendChild(img); 
                                fig.appendChild(cap);
                                
                                // Open lightbox on click
                                fig.addEventListener('click', () => openLightbox(index));
                                fig.addEventListener('keydown', (e) => {
                                    if (e.key === 'Enter' || e.key === ' ') {
                                        e.preventDefault();
                                        openLightbox(index);
                                    }
                                });
                                
                                frag.appendChild(fig);
                            });
                            gallery.innerHTML = ''; 
                            gallery.appendChild(frag);
                        })();
                </script>
    <script src="ticker.js"></script>
        </style>
    </head>
    <img src="illuminati-memes.gif" alt="A picture of me" style="position: fixed; bottom: 0px; right: 0px;">

</body>
